batch_size: 32
dataset: pawsx
epochs: 10
label_noise_min_degree: 2
label_noise_threshold: 7
max_input_length: 128
max_string_len: 1000
model: distilbert
offline_augmentation: []
online_augmentation:
- graph
path_to_test_set: data/raw/beyond_er/pawsx/test_2k.tsv
path_to_train_set: data/raw/beyond_er/pawsx/train.tsv
path_to_val_set: data/raw/beyond_er/pawsx/dev_2k.tsv
pos_neg_ratio_cap: 5
